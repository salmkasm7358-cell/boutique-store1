<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأسئلة الشائعة</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal','Cairo',sans-serif}
body{background:#000;color:#fff;direction:rtl;min-height:100vh;padding-bottom:90px}
.header{position:sticky;top:0;z-index:100;background:#000;border-bottom:1px solid #d4af37;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo-circle{width:48px;height:48px;border:2px solid #d4af37;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#d4af37;font-weight:bold;font-size:22px;background:#111}
.logo-text{color:#d4af37;font-size:13px;margin-top:4px}
.icon-btn{color:#d4af37;font-size:22px;cursor:pointer;position:relative}
.cart-badge{position:absolute;top:-8px;right:-8px;background:#ff0e7a;color:#fff;font-size:11px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.banner{background:linear-gradient(135deg,#000 0%,#1a0a14 50%,#000 100%);border:1px solid #d4af37;border-radius:16px;margin:12px;padding:20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 0 15px rgba(212,175,55,0.2)}
.gift-box{width:110px;height:85px;background:linear-gradient(145deg,#1a1a1a,#000);border:1px solid #d4af37;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative}
.gift-box:after{content:'B';width:36px;height:36px;border:2px solid #d4af37;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#d4af37;font-weight:bold;background:#000;position:absolute;font-size:14px}
.banner-title{font-size:26px;font-weight:900;background:linear-gradient(90deg,#d4af37,#ff0e7a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.banner-sub{font-size:12px;color:#ccc;margin-top:6px}
.card{background:linear-gradient(145deg,#0f0f0f,#050505);border:1px solid #d4af37;border-radius:16px;padding:14px;margin:10px 12px;box-shadow:0 0 10px rgba(212,175,55,0.15)}
.btn-pink{background:linear-gradient(90deg,#ff0e7a,#ff2e8a);color:#fff;border:none;border-radius:24px;padding:12px 20px;font-weight:bold;cursor:pointer;width:100%}
.btn-gold{background:transparent;border:1px solid #d4af37;color:#d4af37;border-radius:24px;padding:12px 20px;font-weight:bold;cursor:pointer;width:100%}
.product-card{display:flex;gap:12px;align-items:center}
.product-img{width:90px;height:90px;border-radius:12px;background:linear-gradient(135deg,#1a0a14,#000);border:1px solid #d4af37;display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0}
.price-pink{color:#ff0e7a;font-weight:bold;font-size:18px}
.price-old{color:#666;text-decoration:line-through;font-size:13px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #d4af37;display:flex;justify-content:space-around;padding:8px 0;z-index:200}
.nav-item{display:flex;flex-direction:column;align-items:center;color:#999;font-size:11px;cursor:pointer;padding:6px 12px;text-decoration:none}
.nav-item.active{color:#ff0e7a}
input,textarea{background:#111;border:1px solid #d4af37;border-radius:12px;padding:12px;color:#fff;width:100%;outline:none}
.timeline{display:flex;justify-content:space-between;align-items:center;margin:16px 0}
.timeline-step{display:flex;flex-direction:column;align-items:center}
.timeline-circle{width:44px;height:44px;border-radius:50%;border:2px solid #d4af37;background:#000;display:flex;align-items:center;justify-content:center}
.timeline-circle.active{border-color:#ff0e7a;background:rgba(255,14,122,0.15)}
</style></head><body>
<div class="header"><div class="icon-btn" onclick="go('cart.html')">🛒<span class="cart-badge" style="display:none">0</span></div><div style="text-align:center;cursor:pointer" onclick="go('index.html')"><div class="logo-circle">B</div><div class="logo-text">بوتيك السعادة</div></div><div style="display:flex;gap:16px"><span class="icon-btn">🔍</span><span class="icon-btn">☰</span></div></div>
<div class="banner"><div class="gift-box"></div><div style="text-align:left"><div class="banner-title">الأسئلة الشائعة</div><div class="banner-sub">نجيب على أهم الاستفسارات</div></div></div>
<div class="card"><input placeholder="ابحث عن سؤال ..."></div><div class="card" style="display:flex;justify-content:space-between" onclick="alert('معلومات الطلبات والشحن: 1-3 أيام داخل المدينة')"><span>🛒 الطلبات والشحن</span><span style="color:#d4af37">›</span></div><div class="card" style="display:flex;justify-content:space-between"><span>💳 طرق الدفع</span><span style="color:#d4af37">›</span></div><div class="card" style="display:flex;justify-content:space-between"><span>📦 المنتجات</span><span style="color:#d4af37">›</span></div><div class="card" style="display:flex;justify-content:space-between"><span>👤 الحساب الشخصي</span><span style="color:#d4af37">›</span></div><div class="card" style="display:flex;justify-content:space-between"><span>🔄 الإرجاع والاستبدال</span><span style="color:#d4af37">›</span></div>
<div class="bottom-nav"><a class="nav-item" href="index.html"><span style="font-size:22px">🏠</span>الرئيسية</a><a class="nav-item" href="categories.html"><span style="font-size:22px">⊞</span>الأقسام</a><a class="nav-item" href="products.html"><span style="font-size:22px">🛍️</span>جميع المنتجات</a><a class="nav-item" href="favorites.html"><span style="font-size:22px">🤍</span>المفضلة</a><a class="nav-item active" href="account.html"><span style="font-size:22px">👤</span>حسابي</a></div>
<script>
function getCart(){return JSON.parse(localStorage.getItem('cart')||'[]')}
function setCart(c){localStorage.setItem('cart',JSON.stringify(c));updateBadge()}
function updateBadge(){let c=getCart();let count=c.reduce((a,b)=>a+b.qty,0);document.querySelectorAll('.cart-badge').forEach(e=>{e.textContent=count;e.style.display=count?'flex':'none'})}
function addToCart(id,name,price){let c=getCart();let f=c.find(i=>i.id==id);if(f)f.qty++;else c.push({id:id,name:name,price:price,qty:1});setCart(c);alert('✅ تمت الإضافة: '+name)}
function toggleFav(id,name,price){let f=JSON.parse(localStorage.getItem('fav')||'[]');let idx=f.findIndex(i=>i.id==id);if(idx>-1){f.splice(idx,1);alert('❌ حذف من المفضلة')}else{f.push({id:id,name:name,price:price});alert('💖 أضيف للمفضلة: '+name)}localStorage.setItem('fav',JSON.stringify(f))}
function getFav(){return JSON.parse(localStorage.getItem('fav')||'[]')}
function go(p){window.location.href=p}
document.addEventListener('DOMContentLoaded',updateBadge)
</script>
</body></html>
